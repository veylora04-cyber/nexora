<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXORA · Onboarding</title>
  <script>
    (function () {
      var l = localStorage.getItem('nx.lang') || 'fa';
      var t = localStorage.getItem('nx.theme') || 'dark';
      document.documentElement.lang = l;
      document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="../assets/tokens.css" />
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="../assets/components.css" />
  <link rel="stylesheet" href="../assets/layouts.css" />
</head>
<body>
  <a class="skip-link" href="#onb-body" data-t="a11y.skip"></a>

  <div class="onb">
    <header class="onb__top">
      <a class="brand" href="../index.html" aria-label="NEXORA">
        <span class="brand__mark" id="brand-mark"></span>
        <span class="brand__word">NEXORA</span>
      </a>

      <div class="onb__steps" id="onb-steps" hidden>
        <span class="onb__step" data-step="1" data-state="current"><span class="onb__step-num" data-num="1"></span><span data-t="onb.step1"></span></span>
        <span class="onb__step-sep"></span>
        <span class="onb__step" data-step="2" data-state="next"><span class="onb__step-num" data-num="2"></span><span data-t="onb.step2"></span></span>
        <span class="onb__step-sep"></span>
        <span class="onb__step" data-step="3" data-state="next"><span class="onb__step-num" data-num="3"></span><span data-t="onb.step3"></span></span>
        <span class="onb__step-sep"></span>
        <span class="onb__step" data-step="4" data-state="next"><span class="onb__step-num" data-num="4"></span><span data-t="onb.step4"></span></span>
      </div>

      <div class="onb__progress" id="onb-progress" hidden aria-hidden="true">
        <div class="onb__progress-fill" id="onb-progress-fill"></div>
      </div>
      <p class="onb__progress-label" id="onb-progress-label" hidden>
        <span data-t="onb.stepOf"></span>
        <span class="t-num"><span id="onb-step-now" data-num="1"></span> / <span data-num="4"></span></span>
      </p>

      <button class="btn btn--quiet btn--sm onb__exit" type="button">
        <svg class="icon icon-dir" aria-hidden="true"><use href="#i-logout"></use></svg>
        <span data-t="onb.exit"></span>
      </button>
    </header>

    <main class="onb__body" id="onb-body">
      <div class="onb__wrap">

        <!-- 1 · Path choice (approved hybrid onboarding) -->
        <section class="onb-view" data-view="choice">
          <div class="onb__head">
            <h1 class="t-h1 onb__title" data-t="onb.choice.title"></h1>
            <p class="t-lead" data-t="onb.choice.sub"></p>
          </div>

          <div class="onb-paths">
            <button class="onb-path onb-path--primary" data-goto="smart">
              <div class="onb-path__title">
                <span data-t="onb.smart.title"></span>
                <span class="badge badge--primary" data-t="onb.recommended"></span>
              </div>
              <p class="onb-path__text" data-t="onb.smart.text"></p>
              <ul class="onb-path__list">
                <li><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg><span data-t="onb.smart.l1"></span></li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg><span data-t="onb.smart.l2"></span></li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg><span data-t="onb.smart.l3"></span></li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg><span data-t="onb.smart.l4"></span></li>
              </ul>
              <div class="onb-path__foot">
                <span class="t-caption" data-t="onb.smart.meta"></span>
                <span class="btn btn--primary btn--sm" data-t="onb.smart.cta"></span>
              </div>
            </button>

            <button class="onb-path" data-goto="free">
              <div class="onb-path__title"><span data-t="onb.free.title"></span></div>
              <p class="onb-path__text" data-t="onb.free.text"></p>
              <ul class="onb-path__list onb-path__list--muted">
                <li><svg class="icon" aria-hidden="true"><use href="#i-dot"></use></svg><span data-t="onb.free.l1"></span></li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-dot"></use></svg><span data-t="onb.free.l2"></span></li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-dot"></use></svg><span data-t="onb.free.l3"></span></li>
              </ul>
              <div class="onb-path__foot">
                <span class="t-caption" data-t="onb.free.meta"></span>
                <span class="btn btn--secondary btn--sm" data-t="onb.free.cta"></span>
              </div>
            </button>
          </div>

          <div class="callout callout--signal" style="margin-block-start:var(--nx-space-5)">
            <svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg>
            <div>
              <div class="callout__title" data-t="onb.consent.title"></div>
              <div data-t="onb.consent.body"></div>
            </div>
          </div>
        </section>

        <!-- 2 · Smart Start · step 1 -->
        <section class="onb-view" data-view="smart" hidden>
          <div class="onb__head">
            <h1 class="t-h2 onb__title" data-t="onb.smart.title2"></h1>
            <p class="t-body" data-t="onb.smart.sub2"></p>
          </div>

          <div class="onb-flow">
            <form class="stack stack-5" onsubmit="return false">
              <div class="field">
                <label class="field__label" for="onb-name" data-t="onb.field.name"></label>
                <input class="input" id="onb-name" type="text" value="استودیو آرا" />
                <p class="field__hint" data-t="onb.field.nameHint"></p>
              </div>

              <div class="field">
                <span class="field__label" data-t="onb.field.type"></span>
                <div class="segmented" role="group" aria-label="Workspace type">
                  <button type="button" aria-selected="false" data-t="ws.level.personal"></button>
                  <button type="button" aria-selected="true" data-t="ws.level.team"></button>
                  <button type="button" aria-selected="false" data-t="ws.level.org"></button>
                </div>
              </div>

              <div class="grid grid-2">
                <div class="field">
                  <label class="field__label" for="onb-size" data-t="onb.field.size"></label>
                  <select class="select" id="onb-size">
                    <option data-t="onb.size.1"></option>
                    <option selected data-t="onb.size.2"></option>
                    <option data-t="onb.size.3"></option>
                  </select>
                </div>
                <div class="field">
                  <label class="field__label" for="onb-lang" data-t="onb.field.lang"></label>
                  <select class="select" id="onb-lang">
                    <option selected>فارسی</option>
                    <option>English</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <span class="field__label" data-t="onb.field.domain"></span>
                <div class="cluster cluster-2">
                  <button type="button" class="chip chip--action" aria-pressed="true" data-t="onb.domain.1"></button>
                  <button type="button" class="chip chip--action" aria-pressed="true" data-t="onb.domain.2"></button>
                  <button type="button" class="chip chip--action" aria-pressed="false" data-t="onb.domain.3"></button>
                  <button type="button" class="chip chip--action" aria-pressed="false" data-t="onb.domain.4"></button>
                </div>
              </div>
            </form>

            <aside class="onb-summary">
              <div class="rule-label"><span data-t="onb.summary.title"></span></div>
              <div class="onb-summary__item">
                <span class="tile-ico tile-ico--primary"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.summary.1.title"></div>
                  <div class="list__sub"><span data-t="onb.summary.1.sub"></span></div>
                </div>
              </div>
              <div class="onb-summary__item">
                <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.summary.2.title"></div>
                  <div class="list__sub"><span data-t="onb.summary.2.sub"></span></div>
                </div>
              </div>
              <div class="onb-summary__item">
                <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-flow"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.summary.3.title"></div>
                  <div class="list__sub"><span data-t="onb.summary.3.sub"></span></div>
                </div>
              </div>

              <div class="callout" style="margin-block-start:var(--nx-space-4)">
                <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
                <div data-t="onb.summary.note"></div>
              </div>

              <div class="cluster cluster-2" style="margin-block-start:var(--nx-space-6)">
                <button class="btn btn--secondary" data-goto="choice" data-t="common.back"></button>
                <button class="btn btn--primary" data-goto="smart2" data-t="common.continue"></button>
              </div>
            </aside>
          </div>
        </section>

        <!-- Smart Start · step 2 · team and access -->
        <section class="onb-view" data-view="smart2" hidden>
          <div class="onb__head">
            <h1 class="t-h2 onb__title" data-t="onb.s2.title"></h1>
            <p class="t-body" data-t="onb.s2.sub"></p>
          </div>

          <div class="onb-flow">
            <form class="stack stack-5" onsubmit="return false">
              <div class="field">
                <label class="field__label" for="onb-invite" data-t="onb.s2.inviteLabel"></label>
                <div class="cluster cluster-2" style="flex-wrap:nowrap">
                  <input class="input" id="onb-invite" type="email" dir="ltr" style="flex:1"
                         data-t-ph="onb.s2.invitePh" />
                  <button class="btn btn--secondary" type="button" data-demo-toast="toast.invited" data-t="onb.s2.add"></button>
                </div>
                <p class="field__hint" data-t="onb.s2.inviteHint"></p>
              </div>

              <div class="field">
                <span class="field__label" data-t="onb.s2.roleLabel"></span>
                <div class="segmented" role="group" aria-label="Default role">
                  <button type="button" aria-selected="true" data-t="onb.role.member"></button>
                  <button type="button" aria-selected="false" data-t="onb.role.admin"></button>
                  <button type="button" aria-selected="false" data-t="onb.role.guest"></button>
                </div>
                <p class="field__hint" data-t="onb.s2.roleNote"></p>
              </div>

              <div class="list list--flush">
                <div class="list__row">
                  <div class="list__main">
                    <div class="list__title" data-t="onb.s2.link"></div>
                    <div class="list__sub" data-t="onb.s2.linkSub"></div>
                  </div>
                  <label class="switch"><input type="checkbox" checked data-t-aria="onb.s2.link" /></label>
                </div>
                <div class="list__row">
                  <div class="list__main">
                    <div class="list__title" data-t="onb.s2.approve"></div>
                    <div class="list__sub" data-t="onb.s2.approveSub"></div>
                  </div>
                  <label class="switch"><input type="checkbox" checked data-t-aria="onb.s2.approve" /></label>
                </div>
              </div>
            </form>

            <aside class="onb-summary">
              <div class="rule-label"><span data-t="onb.s2.sum.title"></span></div>
              <div class="onb-summary__item">
                <span class="tile-ico tile-ico--primary"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s2.sum.1.title"></div>
                  <div class="list__sub" data-t="onb.s2.sum.1.sub"></div>
                </div>
              </div>
              <div class="onb-summary__item">
                <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s2.sum.2.title"></div>
                  <div class="list__sub" data-t="onb.s2.sum.2.sub"></div>
                </div>
              </div>
              <div class="onb-summary__item">
                <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-link"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s2.sum.3.title"></div>
                  <div class="list__sub" data-t="onb.s2.sum.3.sub"></div>
                </div>
              </div>

              <div class="callout" style="margin-block-start:var(--nx-space-4)">
                <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
                <div data-t="onb.s2.note"></div>
              </div>

              <div class="cluster cluster-2" style="margin-block-start:var(--nx-space-6)">
                <button class="btn btn--secondary" data-goto="smart" data-t="common.back"></button>
                <button class="btn btn--primary" data-goto="smart3" data-t="common.continue"></button>
              </div>
            </aside>
          </div>
        </section>

        <!-- Smart Start · step 3 · AI -->
        <section class="onb-view" data-view="smart3" hidden>
          <div class="onb__head">
            <h1 class="t-h2 onb__title" data-t="onb.s3.title"></h1>
            <p class="t-body" data-t="onb.s3.sub"></p>
          </div>

          <div class="onb-flow">
            <form class="stack stack-5" onsubmit="return false">
              <div class="prov-grid">
                <div class="prov-option" role="button" tabindex="0" aria-pressed="true">
                  <div class="prov-option__head">
                    <span class="tile-ico tile-ico--primary"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"></use></svg></span>
                    <div class="grow">
                      <div class="prov-option__title" data-t="onb.s3.central"></div>
                      <div class="t-caption" data-t="onb.s3.centralSub"></div>
                    </div>
                  </div>
                  <p class="t-caption" data-t="onb.s3.centralNote"></p>
                </div>

                <div class="prov-option" role="button" tabindex="0" aria-pressed="false">
                  <div class="prov-option__head">
                    <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-key"></use></svg></span>
                    <div class="grow">
                      <div class="prov-option__title" data-t="onb.s3.personal"></div>
                      <div class="t-caption" data-t="onb.s3.personalSub"></div>
                    </div>
                  </div>
                  <p class="t-caption" data-t="onb.s3.personalNote"></p>
                </div>
              </div>

              <div class="field">
                <label class="field__label" for="onb-model" data-t="onb.s3.model"></label>
                <select class="select" id="onb-model">
                  <option selected data-t="onb.model.balanced"></option>
                  <option data-t="onb.model.fast"></option>
                  <option data-t="onb.model.deep"></option>
                </select>
              </div>

              <details class="onb-adv">
                <summary>
                  <svg class="icon icon-16 icon-dir" aria-hidden="true"><use href="#i-chevronRight"></use></svg>
                  <span data-t="onb.s3.adv"></span>
                  <span class="onb-adv__hint" data-t="onb.s3.advHint"></span>
                </summary>
                <div class="stack stack-5 onb-adv__body">
                  <div class="field">
                    <label class="field__label" for="onb-cap" data-t="onb.s3.cap"></label>
                    <input class="input" id="onb-cap" type="text" inputmode="numeric" value="50" dir="ltr" />
                    <p class="field__hint" data-t="onb.s3.capHint"></p>
                  </div>

                  <div class="field">
                    <label class="field__label" for="onb-retention" data-t="onb.s3.retention"></label>
                    <select class="select" id="onb-retention">
                      <option data-t="onb.s3.ret.1"></option>
                      <option selected data-t="onb.s3.ret.2"></option>
                      <option data-t="onb.s3.ret.3"></option>
                    </select>
                    <p class="field__hint" data-t="onb.s3.retHint"></p>
                  </div>

                  <div class="list list--flush">
                    <div class="list__row">
                      <div class="list__main">
                        <div class="list__title" data-t="onb.s3.fail"></div>
                        <div class="list__sub" data-t="onb.s3.failSub"></div>
                      </div>
                      <label class="switch"><input type="checkbox" checked data-t-aria="onb.s3.fail" /></label>
                    </div>
                  </div>
                </div>
              </details>
            </form>

            <aside class="onb-summary">
              <div class="rule-label"><span data-t="onb.s3.sum.title"></span></div>
              <div class="onb-summary__item">
                <span class="tile-ico tile-ico--primary"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s3.sum.1.title"></div>
                  <div class="list__sub" data-t="onb.s3.sum.1.sub"></div>
                </div>
              </div>
              <div class="onb-summary__item">
                <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s3.sum.2.title"></div>
                  <div class="list__sub" data-t="onb.s3.sum.2.sub"></div>
                </div>
              </div>
              <div class="onb-summary__item">
                <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s3.sum.3.title"></div>
                  <div class="list__sub" data-t="onb.s3.sum.3.sub"></div>
                </div>
              </div>

              <div class="callout" style="margin-block-start:var(--nx-space-4)">
                <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
                <div data-t="onb.s3.note"></div>
              </div>

              <div class="cluster cluster-2" style="margin-block-start:var(--nx-space-6)">
                <button class="btn btn--secondary" data-goto="smart2" data-t="common.back"></button>
                <button class="btn btn--primary" data-goto="smart4" data-t="common.continue"></button>
              </div>
            </aside>
          </div>
        </section>

        <!-- Smart Start · step 4 · review and create -->
        <section class="onb-view" data-view="smart4" hidden>
          <div class="onb__head">
            <h1 class="t-h2 onb__title" data-t="onb.s4.title"></h1>
            <p class="t-body" data-t="onb.s4.sub"></p>
          </div>

          <div class="onb-flow">
            <div class="stack stack-5">
              <div class="list list--flush">
                <div class="list__row">
                  <div class="list__main">
                    <div class="list__title" data-t="onb.s4.r1.title"></div>
                    <div class="list__sub" data-t="onb.s4.r1.sub"></div>
                  </div>
                  <button class="btn btn--quiet btn--sm" data-goto="smart" data-t="common.edit"></button>
                </div>
                <div class="list__row">
                  <div class="list__main">
                    <div class="list__title" data-t="onb.s4.r2.title"></div>
                    <div class="list__sub" data-t="onb.s4.r2.sub"></div>
                  </div>
                  <button class="btn btn--quiet btn--sm" data-goto="smart2" data-t="common.edit"></button>
                </div>
                <div class="list__row">
                  <div class="list__main">
                    <div class="list__title" data-t="onb.s4.r3.title"></div>
                    <div class="list__sub" data-t="onb.s4.r3.sub"></div>
                  </div>
                  <button class="btn btn--quiet btn--sm" data-goto="smart3" data-t="common.edit"></button>
                </div>
              </div>

              <div class="stack stack-3">
                <label class="check">
                  <input type="checkbox" checked />
                  <span data-t="onb.s4.consent1"></span>
                </label>
                <label class="check">
                  <input type="checkbox" checked />
                  <span data-t="onb.s4.consent2"></span>
                </label>
                <label class="check">
                  <input type="checkbox" />
                  <span data-t="onb.s4.consent3"></span>
                </label>
              </div>
            </div>

            <aside class="onb-summary">
              <div class="rule-label"><span data-t="onb.s4.sum.title"></span></div>
              <div class="onb-summary__item">
                <span class="tile-ico tile-ico--primary"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s4.sum.1.title"></div>
                  <div class="list__sub" data-t="onb.s4.sum.1.sub"></div>
                </div>
              </div>
              <div class="onb-summary__item">
                <span class="tile-ico"><svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg></span>
                <div>
                  <div class="list__title" data-t="onb.s4.sum.2.title"></div>
                  <div class="list__sub" data-t="onb.s4.sum.2.sub"></div>
                </div>
              </div>

              <div class="callout" style="margin-block-start:var(--nx-space-4)">
                <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
                <div data-t="onb.s4.note"></div>
              </div>

              <div class="cluster cluster-2" style="margin-block-start:var(--nx-space-6)">
                <button class="btn btn--secondary" data-goto="smart3" data-t="common.back"></button>
                <button class="btn btn--primary" data-demo-toast="toast.saved" data-t="onb.s4.create"></button>
              </div>
            </aside>
          </div>
        </section>

        <!-- 3 · Free Start -->
        <section class="onb-view" data-view="free" hidden>
          <div class="onb__head">
            <h1 class="t-h2 onb__title" data-t="onb.free.title2"></h1>
            <p class="t-body" data-t="onb.free.sub2"></p>
          </div>

          <div style="max-width:440px">
            <form class="stack stack-5" onsubmit="return false">
              <div class="field">
                <label class="field__label" for="free-name" data-t="onb.field.name"></label>
                <input class="input" id="free-name" type="text" data-t-ph="onb.free.namePh" />
              </div>
              <div class="field">
                <span class="field__label" data-t="onb.field.type"></span>
                <div class="segmented" role="group" aria-label="Workspace type">
                  <button type="button" aria-selected="true" data-t="ws.level.personal"></button>
                  <button type="button" aria-selected="false" data-t="ws.level.team"></button>
                  <button type="button" aria-selected="false" data-t="ws.level.org"></button>
                </div>
              </div>
              <div class="callout">
                <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
                <div data-t="onb.free.note"></div>
              </div>
              <div class="cluster cluster-2">
                <button class="btn btn--secondary" data-goto="choice" data-t="common.back"></button>
                <button class="btn btn--primary" data-demo-toast="toast.saved" data-t="onb.free.create"></button>
              </div>
            </form>
          </div>
        </section>

        <!-- Prototype state switcher -->
        <div class="state-switch" role="group" aria-label="Onboarding states">
          <span class="state-switch__label" data-t="onb.states"></span>
          <button data-goto="choice" aria-pressed="true" data-t="onb.state.choice"></button>
          <button data-goto="smart" aria-pressed="false" data-t="onb.state.smart"></button>
          <button data-goto="smart2" aria-pressed="false" data-t="onb.state.s2"></button>
          <button data-goto="smart3" aria-pressed="false" data-t="onb.state.s3"></button>
          <button data-goto="smart4" aria-pressed="false" data-t="onb.state.s4"></button>
          <button data-goto="free" aria-pressed="false" data-t="onb.state.free"></button>
        </div>
      </div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div id="devbar-slot"></div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/i18n.js"></script>
  <script src="../assets/lang/common.js"></script>
  <script src="../assets/lang/onboarding.js"></script>
  <script src="../assets/chrome.js"></script>
  <script>
    document.getElementById('brand-mark').innerHTML = NX.mark(26);
    document.getElementById('devbar-slot').outerHTML = NX.devbar(NX.screens, 'onboarding');

    function showView(name) {
      document.querySelectorAll('.onb-view').forEach(function (v) {
        v.hidden = v.getAttribute('data-view') !== name;
      });
      document.querySelectorAll('.state-switch button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-goto') === name));
      });

      /* The step marker is derived from the view, so it can never disagree
         with the screen it labels. */
      var step = name === 'smart' ? 1 : name === 'smart2' ? 2 : name === 'smart3' ? 3 : name === 'smart4' ? 4 : 0;
      document.getElementById('onb-steps').hidden = step === 0;

      /* The bar and the compact counter are the same fact at two widths: the
         full step list is hidden below 640px, and a step you cannot see is a
         step you cannot trust. */
      var bar = document.getElementById('onb-progress');
      var fill = document.getElementById('onb-progress-fill');
      var label = document.getElementById('onb-progress-label');
      var now = document.getElementById('onb-step-now');
      if (bar) bar.hidden = step === 0;
      if (label) label.hidden = step === 0;
      if (fill) fill.style.width = (step / 4 * 100) + '%';
      if (now) now.textContent = NX.i18n.num(step);
      document.querySelectorAll('.onb__step').forEach(function (s) {
        var n = Number(s.getAttribute('data-step'));
        s.setAttribute('data-state', n < step ? 'done' : n === step ? 'current' : 'next');
      });

      window.scrollTo({ top: 0 });
    }
    document.querySelectorAll('[data-goto]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.preventDefault();
        showView(b.getAttribute('data-goto'));
      });
    });
    document.querySelectorAll('.segmented button').forEach(function (b) {
      b.addEventListener('click', function () {
        b.parentElement.querySelectorAll('button').forEach(function (x) {
          x.setAttribute('aria-selected', 'false');
        });
        b.setAttribute('aria-selected', 'true');
      });
    });
    document.querySelectorAll('.chip[aria-pressed]').forEach(function (c) {
      c.addEventListener('click', function () {
        c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
    });
  </script>
  <script src="../assets/app.js"></script>
</body>
</html>
